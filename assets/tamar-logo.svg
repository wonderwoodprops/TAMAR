<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Tamar Elyashiv animated logo</title>
  <desc id="logo-desc">Animated peach and mint aperture logo with a camera gear and Tamar Elyashiv wordmark.</desc>
  <style>
    :root { color-scheme: light; }
    .logo-bg { fill: #fff; }
    .logo-clip { clip-path: circle(127px at 150px 150px); }
    .blade { fill: #ffa683; stroke: #65feb9; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: bladeDrift 7.7s cubic-bezier(.415,.08,.115,.955) infinite alternate; }
    .blade-1 { --tx: 98.1158px; --ty: -43.512px; }
    .blade-2 { --tx: 11.7026px; --ty: -107.8929px; animation-delay: -.15s; }
    .blade-3 { --tx: -86.1779px; --ty: -65.4103px; animation-delay: -.3s; }
    .blade-4 { --tx: -96.1874px; --ty: 43.7019px; animation-delay: -.45s; }
    .blade-5 { --tx: -11.5425px; --ty: 107.5147px; animation-delay: -.6s; }
    .blade-6 { --tx: 90.4833px; --ty: 66.3953px; animation-delay: -.75s; }
    .logo-chip-shadow { opacity: .2; fill: #112346; }
    .logo-chip-text, .logo-chip-icon { opacity: .84; fill: #fff; }
    .gear-ring { fill: #fff; transform-box: fill-box; transform-origin: center; animation: gearSpin 7.7s cubic-bezier(.415,.08,.115,.955) infinite alternate; }
    .gear-small { fill: #fff; opacity: .84; transform-box: fill-box; transform-origin: center; animation: gearSpinReverse 7.7s cubic-bezier(.415,.08,.115,.955) infinite alternate; }
    .wordmark { fill: #fff; opacity: .88; font: 700 18px Arial, sans-serif; letter-spacing: .4px; }
    .tagline { fill: #fff; opacity: .7; font: 600 9px Arial, sans-serif; letter-spacing: 1.1px; }
    @keyframes bladeDrift {
      0%, 12% { transform: translate(0, 0); }
      48%, 100% { transform: translate(var(--tx), var(--ty)); }
    }
    @keyframes gearSpin {
      0% { transform: rotate(720deg); fill: #fff; }
      100% { transform: rotate(0deg); fill: #d2dbec; }
    }
    @keyframes gearSpinReverse {
      0% { transform: rotate(-720deg); }
      100% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blade, .gear-ring, .gear-small { animation-duration: .001ms; animation-iteration-count: 1; }
    }
  </style>
